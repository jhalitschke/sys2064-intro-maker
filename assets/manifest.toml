# Asset manifest for the C64 Intro Maker disk (see docs/SPEC.md, section 8).
# Only the own test tune lives in the repository. Add your own assets below
# (files in assets/sids and assets/fonts are not committed) and always give
# author and license.

[[sid]]
name    = "TESTMELODIE"        # max. 20 chars: A-Z 0-9 space . , ! ? - : / ( )
file    = "tune-test"          # disk name: a-z 0-9 -, max. 16, lower case
src     = "build/testtune.prg" # .sid (PSID) or .prg
init    = 0x1000               # required for .prg only
play    = 0x1003
subtune = 0
author  = "Joerg Halitschke"
license = "eigene Produktion"

