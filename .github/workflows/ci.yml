name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VICE tools (c1541)
        run: |
          sudo apt-get update
          sudo apt-get install -y vice

      - name: Install KickAssembler
        run: |
          mkdir -p "$HOME/kickass" "$HOME/bin"
          curl -sSL -o "$HOME/kickass/ka.zip" http://theweb.dk/KickAssembler/KickAssembler.zip
          unzip -q "$HOME/kickass/ka.zip" -d "$HOME/kickass"
          printf '#!/bin/sh\nexec java -jar "%s/kickass/KickAss.jar" "$@"\n' "$HOME" > "$HOME/bin/kickass"
          chmod +x "$HOME/bin/kickass"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install Exomizer
        run: |
          git clone -q --depth 1 https://bitbucket.org/magli143/exomizer.git "$HOME/exomizer"
          make -s -C "$HOME/exomizer/src"
          cp "$HOME/exomizer/src/exomizer" "$HOME/bin/"

      - name: Unit tests
        run: make test

      - name: Build disk, fixture and web demo
        run: make disk fixture demo

      - name: Assemble the web page
        run: |
          mkdir -p site
          cp web/*.html site/
          cp build/intromaker.d64 build/demo.prg site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: intromaker
          path: |
            build/intromaker.d64
            build/editor.prg
            build/fixture.prg
            build/CREDITS.txt

  pages:
    # the editor and a demo intro in the browser (EmulatorJS, VICE x64sc core)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
